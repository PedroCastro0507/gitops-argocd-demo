name: Validate manifests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  kubeconform:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Render and validate the overlays
        run: |
          for env in dev prod; do
            echo "Validating overlay: $env"
            kubectl kustomize "apps/web/overlays/$env" | kubeconform -strict -summary -kubernetes-version 1.30.0
          done

      - name: Validate the ArgoCD applications
        run: kubeconform -strict -summary -ignore-missing-schemas argocd/applications
